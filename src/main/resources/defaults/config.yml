# Vertex Velocity Web Panel — HTTP-only configuration
web-panel:
  enabled: true
  mode: HTTP
  bind-address: 127.0.0.1
  http-port: 25569
security:
  session-minutes: 60
  login-attempts-per-minute: 8
  trust-proxy-headers: false
statistics:
  sample-seconds: 15
  retention-days: 30
  backend-connect-timeout-ms: 1500
monitoring:
  high-latency-ms: 1000
  alert-cooldown-seconds: 300
  alert-history-limit: 1000
discord:
  enabled: false
  webhook-url: ''
